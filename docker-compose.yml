services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/trendywear
  client:
    build: ./client
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env